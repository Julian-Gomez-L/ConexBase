# Publica la documentación (carpeta docs/) en GitHub Pages.
#
# - En cada push a main que cambie la documentación: construye el sitio y lo publica.
# - En cada Pull Request: solo lo construye, para avisar si algo quedó roto
#   (un enlace a una página que no existe, por ejemplo) antes de unirlo.
#
# Requisito, una sola vez: en GitHub → Settings → Pages → Source, elegir "GitHub Actions".
name: Documentación

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CONTRIBUTING.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "CONTRIBUTING.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar MkDocs
        run: pip install -r requirements-docs.txt

      - name: Construir el sitio
        # --strict: falla si hay enlaces rotos o páginas fuera del menú
        run: mkdocs build --strict

      - name: Subir el sitio
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

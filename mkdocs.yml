# Sitio de documentación de ConexBase (MkDocs + Material).
#   Ver en local:  pip install -r requirements-docs.txt && mkdocs serve   → http://127.0.0.1:8000
#   Publicación:   automática en GitHub Pages con .github/workflows/docs.yml
# Si el puerto 8000 está ocupado por la API, usa: mkdocs serve -a 127.0.0.1:8001

site_name: ConexBase · Documentación
site_description: Sistema de pedidos y producción de Basecamas y Colchones El Dormilón
site_url: https://julian-gomez-l.github.io/ConexBase/
repo_url: https://github.com/Julian-Gomez-L/ConexBase
repo_name: Julian-Gomez-L/ConexBase
edit_uri: edit/main/docs/
copyright: Proyecto académico SENA · Tecnólogo en Análisis y Desarrollo de Software · ficha 3177445

theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/conexbase.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Permite incluir archivos de la raíz (CONTRIBUTING.md) dentro de una página
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Avisa (y con --strict, falla) si un enlace apunta a un título que no existe
validation:
  anchors: warn

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Primeros pasos:
      - Instalar con Docker: primeros-pasos/instalacion.md
      - Usuarios de prueba: primeros-pasos/usuarios-prueba.md
  - Arquitectura:
      - arquitectura/index.md
      - 1. Introducción y objetivos: arquitectura/01-introduccion.md
      - 2. Restricciones: arquitectura/02-restricciones.md
      - 3. Contexto y alcance: arquitectura/03-contexto.md
      - 4. Estrategia de solución: arquitectura/04-estrategia.md
      - 5. Vista de bloques: arquitectura/05-vista-de-bloques.md
      - 6. Vista de ejecución: arquitectura/06-vista-de-ejecucion.md
      - 7. Despliegue: arquitectura/07-despliegue.md
      - 8. Conceptos transversales: arquitectura/08-conceptos.md
      - 9. Decisiones: arquitectura/09-decisiones.md
      - 10. Calidad y pruebas: arquitectura/10-calidad.md
      - 11. Riesgos y deuda técnica: arquitectura/11-riesgos.md
      - 12. Glosario: arquitectura/12-glosario.md
  - Decisiones (ADR):
      - decisiones/index.md
      - ADR-0001 Arquitectura en capas: decisiones/0001-arquitectura-en-capas.md
      - ADR-0002 Token de acceso propio: decisiones/0002-token-propio.md
      - ADR-0003 Borrado lógico: decisiones/0003-borrado-logico.md
      - ADR-0004 Zona horaria de Colombia: decisiones/0004-zona-horaria-bogota.md
      - ADR-0005 Procesos en el frontend: decisiones/0005-procesos-en-el-frontend.md
      - ADR-0006 Un repositorio con Docker: decisiones/0006-un-repositorio-con-docker.md
      - Plantilla para un ADR nuevo: decisiones/plantilla.md
  - ¿Dónde hago el cambio?:
      - guias/index.md
      - Agregar un campo: guias/agregar-campo.md
      - Crear un recurso nuevo: guias/nuevo-recurso.md
      - Agregar una operación a la API: guias/nueva-operacion.md
      - Crear una pantalla: guias/nueva-pantalla.md
      - Cambiar permisos o roles: guias/permisos.md
      - Agregar un estado de pedido: guias/estado-pedido.md
      - Cambiar una regla de negocio: guias/regla-de-negocio.md
  - Base de datos: datos/index.md
  - API REST: api/index.md
  - Cómo contribuir: contribuir.md

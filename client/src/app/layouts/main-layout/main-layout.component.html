<div class="min-h-screen bg-background text-foreground">
  <!-- Fondo oscuro al abrir el menú en móvil -->
  @if (menuAbierto()) {
    <div
      class="fixed inset-0 bg-black/60 z-40 lg:hidden"
      (click)="alternarMenu()"
      aria-hidden="true"
    ></div>
  }

  <!-- Sidebar -->
  <aside
    class="fixed left-0 top-0 bottom-0 w-[280px] bg-sidebar border-r border-sidebar-border z-50 transition-transform duration-300"
    [class.-translate-x-full]="!menuAbierto()"
    aria-label="Navegación principal"
  >
    <div class="flex flex-col h-full">
      <!-- Logo -->
      <div class="p-6 border-b border-sidebar-border">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <svg lucideSparkles class="w-6 h-6 text-primary" aria-hidden="true"></svg>
            <div>
              <h1 class="text-lg font-semibold tracking-tight">
                <span class="text-primary">BaseCamas</span>
              </h1>
              <p class="text-xs text-muted-foreground">El Dormilón</p>
            </div>
          </div>
          <button
            type="button"
            class="lg:hidden p-2 hover:bg-sidebar-accent rounded-md transition-colors"
            (click)="alternarMenu()"
            aria-label="Cerrar menú"
          >
            <svg lucideX class="w-5 h-5" aria-hidden="true"></svg>
          </button>
        </div>
      </div>

      <!-- Navegación -->
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto text-sidebar-foreground">
        @for (item of menu(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active bg-primary text-primary-foreground shadow-lg shadow-primary/20 hover:bg-primary"
            [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
            (click)="alNavegar()"
            class="group flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 [&:not(.is-active)]:hover:bg-sidebar-accent"
          >
            <svg [lucideIcon]="item.icon" class="w-5 h-5" aria-hidden="true"></svg>
            <span class="font-medium">{{ item.label }}</span>
            <span
              class="ml-auto w-2 h-2 rounded-full bg-primary-foreground hidden group-[.is-active]:block"
            ></span>
          </a>
        }
      </nav>

      <!-- Pie: usuario y cierre de sesión -->
      <div class="p-4 border-t border-sidebar-border space-y-3">
        <div class="p-3 bg-sidebar-accent rounded-lg">
          <p class="text-xs text-muted-foreground">Sesión iniciada como</p>
          <p class="text-sm font-medium mt-1">{{ sesion()?.nombre }}</p>
          <p class="text-xs text-primary mt-1">{{ etiquetaRol() }}</p>
        </div>
        <button
          type="button"
          (click)="cerrarSesion()"
          class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-destructive/20 text-destructive rounded-lg hover:bg-destructive/30 transition-colors"
        >
          <svg lucideLogOut class="w-4 h-4" aria-hidden="true"></svg>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </aside>

  <!-- Contenido -->
  <div class="transition-all duration-300" [class]="menuAbierto() ? 'lg:ml-[280px]' : ''">
    <header class="sticky top-0 z-30 bg-card/95 border-b border-border backdrop-blur-sm">
      <div class="flex items-center justify-between px-6 py-4">
        <button
          type="button"
          (click)="alternarMenu()"
          class="p-2 hover:bg-secondary rounded-lg transition-colors"
          aria-label="Abrir o cerrar menú"
        >
          <svg lucideMenu class="w-5 h-5" aria-hidden="true"></svg>
        </button>
        <p class="text-sm text-muted-foreground first-letter:uppercase">{{ fecha }}</p>
      </div>
    </header>

    <main class="p-6">
      <router-outlet />
    </main>
  </div>
</div>

<div class="min-h-screen bg-background text-foreground flex items-center justify-center p-4">
  <!-- Decoración de fondo -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="bg-card border border-border rounded-2xl p-8 shadow-2xl shadow-black/40">
      <!-- Marca -->
      <div class="flex flex-col items-center mb-8">
        <div class="p-2 bg-primary/10 rounded-xl border border-primary/30 mb-4">
          <svg lucideSparkles class="w-7 h-7 text-primary" aria-hidden="true"></svg>
        </div>
        <h1 class="text-2xl font-semibold tracking-tight">
          <span class="text-primary">BaseCamas</span> <span>El Dormilón</span>
        </h1>
        <p class="text-sm text-muted-foreground mt-1">Sistema de Gestión ERP</p>
      </div>

      <div class="border-t border-border mb-8"></div>

      <form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-5" novalidate>
        <div>
          <label for="correo" class="block text-sm font-medium mb-2">Correo electrónico</label>
          <input
            id="correo"
            type="email"
            formControlName="correo"
            placeholder="admin@conexbase.com"
            autocomplete="username"
            class="w-full px-4 py-3 bg-secondary border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all text-sm"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-2">Contraseña</label>
          <div class="relative">
            <input
              id="password"
              [type]="verClave() ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full px-4 py-3 pr-12 bg-secondary border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all text-sm"
            />
            <button
              type="button"
              (click)="verClave.set(!verClave())"
              class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-muted-foreground hover:text-foreground transition-colors"
              [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (verClave()) {
                <svg lucideEyeOff class="w-4 h-4" aria-hidden="true"></svg>
              } @else {
                <svg lucideEye class="w-4 h-4" aria-hidden="true"></svg>
              }
            </button>
          </div>
        </div>

        @if (error()) {
          <p
            role="alert"
            class="text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg px-4 py-3"
          >
            {{ error() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="enviando()"
          class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-primary to-primary/80 text-primary-foreground rounded-lg font-medium hover:shadow-lg hover:shadow-primary/25 transition-all disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <svg lucideLogIn class="w-5 h-5" aria-hidden="true"></svg>
          {{ enviando() ? 'Ingresando…' : 'Acceder al Sistema' }}
        </button>
      </form>

      <p class="text-center text-xs text-muted-foreground mt-6">
        Sistema interno exclusivo para personal autorizado
      </p>
    </div>
  </div>
</div>
